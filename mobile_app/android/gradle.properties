# ضبط ذاكرة Gradle لآلة 4GB بلا Swap — الشيطان قُتل بـ OOM عند 1536m+1024m
# منفصلَين، فخُفّض الحد ودمج مترجم Kotlin داخل شيطان Gradle نفسه.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
