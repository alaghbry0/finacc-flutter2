name: mobile_app
description: "FinAcc — المُحاسِب الشخصي: نظام محاسبي ومخزون متكامل (SRS v1.5)"
publish_to: 'none'

version: 0.11.0+11

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Localization (i18n) — ARB-based code generation, see l10n.yaml
  flutter_localizations:
    sdk: flutter
  intl: any

  # Declarative routing with deep-linking support (MaterialApp.router)
  go_router: ^18.0.2

  # Dependency injection + MVVM state management (ChangeNotifier)
  provider: ^6.1.5+1

  # iOS-style icons for Cupertino widgets
  cupertino_icons: ^1.0.8

  # ── Storage engine (SRS §0.3 / §5.3) ──
  # Local SQLite 100% offline-first. WAL always on.
  sqflite: ^2.4.2
  # Web preview uses the FFI Web driver (IndexedDB persistence + sqlite3.wasm).
  sqflite_common_ffi_web: ^1.1.1
  # Pure-Dart crypto for PIN hashing (PBKDF2-HMAC-SHA256) + secure random salt.
  crypto: ^3.0.6
  # Database file location on Android.
  path_provider: ^2.1.5
  path: ^1.9.1
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  excel: ^4.0.6
  file_picker: ^13.1.0

  # ── رفع شعار المنشأة (UX-2a — بيانات المنشأة) ──
  # اختيار صورة الشعار من معرض الجهاز — تُضغط PNG ثم تُخزَّن BLOB داخل
  # القاعدة (هجرة v3) فتنجو مع النسخة الاحتياطية.
  image_picker: ^1.2.4

  # ── الطباعة والمشاركة (الشريحة 7 — SRS §5.4/وحدة 10) ──
  # توليد PDF (pdf) + المعاينة/الطباعة/المشاركة (printing) + روابط واتساب
  # wa.me عبر url_launcher — كله يعمل أوفلاين بلا سيرفر.
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.3

  # ── النسخ الاحتياطي والاستعادة (الشريحة 8 — وحدة 11) ──
  # ضغط ZIP للنسخة (.finbak = zip: manifest.json + finacc.db) — archive
  # خالص Dart بلا كود أصلي (آمن لقيود NDK/القرص 10GB).
  # ^3.6.1 لأن excel 4.0.6 (استيراد الأصناف) يقيد archive بـ 3.x.
  archive: ^3.6.1
  # مشاركة ملف النسخة عبر نظام التشغيل (FR-11-08 — واتساب/درايف/بلوتوث)
  # وبديل الحفظ في Downloads — Java فقط بلا NDK.
  share_plus: ^13.3.1

# ── قيد البيئة: NDK ──
# path_provider_android 2.3.x تعتمد على حزمة jni ذات كود C++ أصلي (CMake/NDK)
# — وتنزيل NDK (~4GB) غير ممكن على قرص 10GB ويُمحى مع كل إعادة تشغيل للـ sandbox.
# الإصدار 2.2.17 (MethodChannel المجرب) يقدم نفس API حرفياً بلا كود أصلي.
# يُزال هذا القيد عند توفر قرص أكبر أو توفير jni ثنائيات جاهزة.
dependency_overrides:
  path_provider_android: 2.2.17

# ── منهجية التحقق (حزام مزدوج منذ الجولة 14) ──
# البوابات: analyze 0/0 + flutter test (414+) + بناء المعاينة + التحقق الحي
# من المتصفح (انظر AGENTS.md §4-7). مجلد test/ مسترد ومؤمّن في git.
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Recommended lint set activated in analysis_options.yaml
  flutter_lints: ^6.0.0
  # اختبارات القاعدة عبر FFI (نفس محرك التطبيق) — كانت تبعية عابرة فقط،
  # أُعلنت صراحة لتصريف depend_on_referenced_packages في ملفات الاختبار.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  # Enables automatic generation of AppLocalizations from lib/l10n/*.arb
  generate: true

  assets:
    - assets/fonts/almarai/

  fonts:
    # Almarai (المراعي) — SRS §0.3: الخط الرسمي مضمن محلياً (أوفلاين).
    # الأوزان المتاحة فعلياً في العائلة: 300/400/700/800 (لا وُجد Medium).
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 800
