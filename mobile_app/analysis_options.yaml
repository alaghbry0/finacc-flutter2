# Strict analyzer configuration — Quality Gate 0.5 (SRS):
# `dart analyze` must report ZERO errors and ZERO warnings.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - l10n/**

linter:
  rules:
    # Keep code documentation honest and maintenance cheap.
    public_member_api_docs: false
    # Enforce explicit types on public APIs of the domain layer.
    always_declare_return_types: true
    prefer_final_locals: true
    unawaited_futures: true
    discarded_futures: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    use_super_parameters: true
    # ── R18-D5 تشديد آمن (يعمل نظيفاً على الكود الحالي) ──
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    prefer_const_declarations: true
    prefer_final_in_for_each: true
    # ── R19-D5 القاعدتان المؤجلتان (دين R18-D5: 73 و522 موضعاً) فُعِّلتا وأُصلح كل مواضعهما ──
    prefer_const_constructors: true
    avoid_redundant_argument_values: true
    # ── R19-D5 تشديد إضافي (قِيس صفرَ مواضع) ──
    prefer_const_literals_to_create_immutables: true
    # دين مؤجل (سياسة R18-D5: >20 موضعاً): prefer_single_quotes ‏(46 موضعاً —
    # رأيُ تنسيقٍ خارج flutter_lints لا قاعدة صحة، فلا تُفعَّل ما لم تُتبنَّ قراراً).
    # مرشحان قِيسا واستُبعدا: unnecessary_import وunused_field ليسا اسمَي قاعدتين
    # معرفتين في إصدار SDK هذا (التغطية المكافئة عبر تشخيصات المحلل المدمجة)؛
    # وavoid_unnecessary_containers/unnecessary_this/unnecessary_string_interpolations
    # تأتي أصلاً مع flutter_lints/recommended وصفر مواضع.
