# بناء APK آلياً على GitHub Actions — أسسه المنسق بجولة R16 لأن قرص
# الـ sandbox المحدود (9.9G مع صورة overlayfs غير قابلة للتحرر) لا
# يستوعب ذروة ذاكرة/قرص بناء Gradle الكاملة. من الآن فصاعداً كل tag
# v* يبني APK موقّعاً debug (حتى إنشاء keystore إنتاجي بقرار المالك)
# ويرفقه بإصدار GitHub Release تلقائياً.
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze gate
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finacc-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
