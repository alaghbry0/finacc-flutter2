# بناء APK آلياً على GitHub Actions — أسسه المنسق بجولة R16 لأن قرص
# الـ sandbox المحدود (9.9G مع صورة overlayfs غير قابلة للتحرر) لا
# يستوعب ذروة ذاكرة/قرص بناء Gradle الكاملة. من الآن فصاعداً كل tag
# v* يبني APK موقّعاً debug (حتى إنشاء keystore إنتاجي بقرار المالك)
# ويرفقه بإصدار GitHub Release تلقائياً.
#
# [جولة R17-followup 2026-10-09] ترقية استباقية لكل الأفعال المُحذَّرة
# (checkout v4→v7, setup-java v4→v6, upload-artifact v4→v7, gh-release
# v2→v3 — كلها Node 24 أصلية) + تثبيت ubuntu-24.04 صراحةً لأن
# ubuntu-latest يتحول إلى Ubuntu 26 في 2026-10-19 (بعد 10 أيام!) وقد
# يكسر سلسلة الأدوات فجأة + إضافة بوابة flutter test كاملة (792 اختباراً)
# قبل البناء — لم يعد الإصدار يعتمد على analyze وحده.
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # مثبّت عمداً: ubuntu-latest يُرحَّل إلى Ubuntu 26 بتاريخ 2026-10-19
    # (إشعار runner-images#14748) — التثبيت يمنع مفاجأة كسر البناء قبيل v1.0.0.
    # عند الرغبة بالترقية مستقبلاً: جرّب ubuntu-26 على فرع أولاً ثم حدّث هنا.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze gate
        run: flutter analyze

      - name: Test gate (الجناح الكامل — 792 اختباراً)
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: finacc-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
